services:
  # Eureka Server (Service Discovery)
  discovery-service:
    build:
      context: ./discovery-service
    ports:
      - "${EUREKA_PORT}:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=${ACTIVE_PROFILE}
      - SERVER_PORT=${EUREKA_PORT}
      - TZ=${TIMEZONE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${EUREKA_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Config Server (Spring Cloud Config)
  config-server:
    build:
      context: ./config-server
    ports:
      - "${CONFIG_PORT}:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=${ACTIVE_PROFILE}
      - SERVER_PORT=${CONFIG_PORT}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${DISCOVERY_URL}
      - TZ=${TIMEZONE}
    depends_on:
      - discovery-service
    volumes:
      - ./config-repo:/config-repo
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${CONFIG_PORT}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  gateway-service:
    build:
      context: ./gateway-service
    ports:
      - "${API_GATEWAY_PORT}:8080"
    environment:
#      - KEYCLOAK_URL=${KEYCLOAK_URL}
#      - KC_REALM=${KC_REALM}
#      - KC_CLIENT_ID=${KC_CLIENT_ID}
#      - KC_CLIENT_SECRET=${KC_CLIENT_SECRET}
#      - KC_USERNAME=${KC_USERNAME}
#      - KC_PASSWORD=${KC_PASSWORD}
#      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${JWT_ISSUER_URI}
      - JWT_ISSUER_URI=${JWT_ISSUER_URI}
      - SPRING_PROFILES_ACTIVE=${ACTIVE_PROFILE}
      - SERVER_PORT=${API_GATEWAY_PORT}
      - CLOUD_CONFIG_URL=${CLOUD_CONFIG_URL}
      - SPRING_CLOUD_CONFIG_URI=${CLOUD_CONFIG_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${DISCOVERY_URL}
      - TZ=${TIMEZONE}
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${API_GATEWAY_PORT}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
    ports:
      - "${AUTH_PORT}:8081"
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KC_REALM=${KC_REALM}
      - KC_CLIENT_ID=auth-service
      - KC_CLIENT_SECRET=${KC_CLIENT_SECRET_AUTH_SERVICE}
      - KC_ADMIN_USERNAME=${KC_ADMIN_USER}
      - KC_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}
      - KC_TOKEN_URI=${KC_TOKEN_URI}
      - JWT_ISSUER_URI=${JWT_ISSUER_URI}
      - SPRING_PROFILES_ACTIVE=${ACTIVE_PROFILE}
      - SERVER_PORT=${AUTH_PORT}
      - CLOUD_CONFIG_URL=${CLOUD_CONFIG_URL}
      - SPRING_CLOUD_CONFIG_URI=${CLOUD_CONFIG_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${DISCOVERY_URL}
      - TZ=${TIMEZONE}
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-service:
        condition: service_started
      postgres:
        condition: service_started

  # Account Service
  account-service:
    build:
      context: ./account-service
    ports:
      - "${ACCOUNT_PORT}:8082"
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KC_REALM=${KC_REALM}
      - KC_CLIENT_ID=backend-service
#      - KC_CLIENT_SECRET=${KC_CLIENT_SECRET}
#      - KC_USERNAME=${KC_USERNAME}
#      - KC_PASSWORD=${KC_PASSWORD}
      - JWT_ISSUER_URI=${JWT_ISSUER_URI}
      - SPRING_PROFILES_ACTIVE=${ACTIVE_PROFILE}
      - SERVER_PORT=${ACCOUNT_PORT}
      - CLOUD_CONFIG_URL=${CLOUD_CONFIG_URL}
      - SPRING_CLOUD_CONFIG_URI=${CLOUD_CONFIG_URL}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${DISCOVERY_URL}
      - SPRING_DATASOURCE_URL=${DB_URL}/account_database
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - TZ=${TIMEZONE}
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_started
      postgres:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${ACCOUNT_PORT}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=${TIMEZONE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/db:/docker-entrypoint-initdb.d

  # Keycloak (Identity Provider)
  keycloak:
    image: keycloak/keycloak:26.3
    environment:
      - KEYCLOAK_ADMIN=${KC_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}
      - KC_DB_URL=${KC_DB_URL}
      - KC_DB_USERNAME=${KC_DB_USER}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      - KC_DB=postgres
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - TZ=${TIMEZONE}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    command: [ "start-dev", "--health-enabled=true" ]
#    volumes:
#      - ./init/keycloak-realm:/opt/keycloak/data/import
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
 postgres_data:
#  config-repo: